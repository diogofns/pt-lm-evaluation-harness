# Professor: base 8K, zero-shot, MCF/CF. Triton evita compilação inicial longa do FlashInfer MoE.
experiment: nemotron_lightning_teacher_base_8k_full_b200
output_dir: output
seed: 1234
num_fewshot: 0
gpus:
- 0
concurrency: 128
server:
  mode: local
  executable: /usr/local/bin/vllm
  port: 8000
  args:
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.8
    generation_config: vllm
    seed: 1234
    trust_remote_code: true
    mamba_ssm_cache_dtype: float32
    moe_backend: triton
models:
- name: /workspace/projects/icml/nemotron-cpt/checkpoints/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Base-BF16
  type: base
  label: nemotron-lightning-30b-a3b-teacher
benchmarks:
- name: enem
  evaluations:
  - mcf
  - cf
- name: oab_exams
  evaluations:
  - mcf
  - cf
- name: mmlu_pt_high_school
  evaluations:
  - mcf
  - cf
- name: mmlu_pt_undergraduate
  exclude_ids:
  - stem-1605
  evaluations:
  - mcf
  - cf
