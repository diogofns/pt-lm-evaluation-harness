# Original + dez checkpoints: log-likelihood MCF/CF, zero-shot, sem chat template.
# Contexto 8K; enunciados que excedem o limite usam truncamento à esquerda do harness.
experiment: pt_nemotron_kd_pt_v1_base_8k_full_b200
output_dir: output
seed: 1234
num_fewshot: 0
gpus:
- 0
- 1
- 2
- 3
- 4
- 5
- 6
- 7
concurrency: 128
server:
  mode: local
  executable: /usr/local/bin/vllm
  port: 8000
  args:
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.8
    generation_config: vllm
    seed: 1234
    trust_remote_code: true
    mamba_ssm_cache_dtype: float32
models:
- name: /workspace/projects/portuguese_nemotron/checkpoints/NVIDIA-Nemotron-3-Nano-4B-BF16
  type: base
  label: nemotron-original
- name: /workspace/projects/icml/pt-nemotron-kd/runs/pt-v1/exports/iter_0000500
  type: base
  label: pt-v1-step-0500
- name: /workspace/projects/icml/pt-nemotron-kd/runs/pt-v1/exports/iter_0001000
  type: base
  label: pt-v1-step-1000
