# Instruct: geração com chat template nativo, zero-shot e temperatura 0.
# Múltipla escolha: 512 tokens; apenas Tucano usa 256 devido ao contexto de 4096.
# IFEval: 2048 tokens para todos, pelo próprio avaliador.
# Qwen/Nemotron sem thinking; Tucano repetition_penalty 1.2 conforme model card.
# Exclusão stem-1605 em MMLU-PT graduação mantida das avaliações anteriores.
experiment: instruct_pt_six_benchmarks_full_b200
output_dir: output
seed: 1234
num_fewshot: 0
gpus:
- 0
- 1
- 2
- 3
- 4
concurrency: 128
server:
  mode: local
  executable: /usr/local/bin/vllm
  port: 8040
  args:
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.8
    generation_config: vllm
    seed: 1234
    trust_remote_code: true
models:
- name: /root/.cache/huggingface/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  type: instruct
  label: qwen3.5-4b-instruct-no-thinking
  server_args:
    language_model_only: true
    reasoning_parser: qwen3
  generate:
    temperature: 0
    max_tokens: 512
  thinking: false
- name: /workspace/projects/portuguese_nemotron/checkpoints/NVIDIA-Nemotron-3-Nano-4B-BF16
  type: instruct
  label: nemotron-original-instruct-no-thinking
  generate:
    temperature: 0
    max_tokens: 512
  server_args:
    reasoning_parser: nemotron_v3
    mamba_ssm_cache_dtype: float32
  thinking: false
- name: /workspace/projects/icml/pt-lm-evaluation-harness/.cache/huggingface/hub/models--meta-llama--Llama-3.2-3B-Instruct/snapshots/0cb88a4f764b7a12671c53f0838cd831a0843b95
  type: instruct
  label: llama-3.2-3b-instruct
  generate:
    temperature: 0
    max_tokens: 512
  server_args: {}
- name: /root/.cache/huggingface/hub/models--CEIA-UFG--Gemma-3-Gaia-PT-BR-4b-it/snapshots/e05c0790ada2e2552105a31140cf0c239ca0de6e
  type: instruct
  label: gaia-4b-it
  server_args:
    language_model_only: true
  generate:
    temperature: 0
    max_tokens: 512
- name: /workspace/projects/icml/pt-lm-evaluation-harness/.cache/huggingface/hub/models--TucanoBR--Tucano-2b4-Instruct/snapshots/fa186b3507acd65ee859956e31ee3e11f81fe726
  type: instruct
  label: tucano-2b4-instruct
  server_args:
    max_model_len: 4096
  generate:
    temperature: 0
    max_tokens: 256
    repetition_penalty: 1.2
benchmarks:
- name: global_piqa_nonparallel_pt_br
  evaluations:
  - gen
- name: ifeval_pt
  evaluations:
  - ifeval
- name: global_mmlu_pt
  evaluations:
  - gen
- name: mmlu_prox_pt
  evaluations:
  - gen
- name: mmlu_pt_high_school
  evaluations:
  - gen
- name: mmlu_pt_undergraduate
  evaluations:
  - gen
  exclude_ids:
  - stem-1605
