# Comparação de throughput na B200, com os mesmos 256 itens em todos os casos.
# A primeira configuração reproduz os limites anteriores (8 / 8192).
# Compara concorrência 32, 64 e 128; depois compara 8192 / 16384 com concorrência 64.
# Execute após liberar a GPU e a porta 8000 usadas pelo experimento atual.
# Compare timing.seconds (exclui inicialização do servidor), acc, extracted e truncated.
# É uma triagem; confirme a melhor configuração com repetições antes de adotá-la.
# Reexecutar o mesmo experimento retoma amostras: use outro nome para uma nova medição.

experiment: tuning_qwen35_4b_b200_256
output_dir: output
seed: 1234
limit: 256
num_fewshot: 0
concurrency: 64
server:
  mode: local
  executable: /usr/local/bin/vllm
  port: 8000
  args:
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 32768
    max_num_seqs: 64
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.8
    generation_config: vllm
    seed: 1234
    reasoning_parser: qwen3
    language_model_only: true
models:
- name: Qwen/Qwen3.5-4B
  label: qwen35-4b-c8-t8192
  type: instruct
  thinking: false
  concurrency: 8
  server_args:
    max_num_seqs: 8
    max_num_batched_tokens: 8192
  generate:
    temperature: 0
    max_tokens: 4096
- name: Qwen/Qwen3.5-4B
  label: qwen35-4b-c32-t16384
  type: instruct
  thinking: false
  concurrency: 32
  server_args:
    max_num_seqs: 32
    max_num_batched_tokens: 16384
  generate:
    temperature: 0
    max_tokens: 4096
- name: Qwen/Qwen3.5-4B
  label: qwen35-4b-c64-t16384
  type: instruct
  thinking: false
  concurrency: 64
  server_args:
    max_num_seqs: 64
    max_num_batched_tokens: 16384
  generate:
    temperature: 0
    max_tokens: 4096
- name: Qwen/Qwen3.5-4B
  label: qwen35-4b-c128-t16384
  type: instruct
  thinking: false
  concurrency: 128
  server_args:
    max_num_seqs: 128
    max_num_batched_tokens: 16384
  generate:
    temperature: 0
    max_tokens: 4096
- name: Qwen/Qwen3.5-4B
  label: qwen35-4b-c64-t8192
  type: instruct
  thinking: false
  concurrency: 64
  server_args:
    max_num_seqs: 64
    max_num_batched_tokens: 8192
  generate:
    temperature: 0
    max_tokens: 4096
benchmarks:
- mmlu_pt_high_school
