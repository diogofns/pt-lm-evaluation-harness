# 10 checkpoints + modelo original, sem thinking, todos os itens.
# Contexto de inferência 96K: uma questão de graduação exige 72.969 tokens com a resposta reservada.
experiment: pt_nemotron_kd_pt_v1_no_thinking_full_b200
output_dir: output
seed: 1234
num_fewshot: 0
gpus:
- 0
- 1
- 2
- 3
- 4
- 5
- 6
- 7
concurrency: 128
server:
  mode: local
  executable: /usr/local/bin/vllm
  port: 8000
  args:
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 98304
    max_num_seqs: 128
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.8
    generation_config: vllm
    seed: 1234
    trust_remote_code: true
    mamba_ssm_cache_dtype: float32
    reasoning_parser: nemotron_v3
models:
