# Complemento da comparação com 12 modelos, nos três benchmarks em PT.
# type: base seleciona MCF/CF sem chat, inclusive para checkpoints Instruct.
# Revisões fixadas nos caminhos locais; Gemma usa apenas texto; Tucano usa 4K.
experiment: cpt_multilingual_pt_extra_full_b200
output_dir: output
seed: 1234
num_fewshot: 0
gpus:
- 0
- 1
- 2
- 3
- 4
- 5
concurrency: 128
server:
  mode: local
  executable: /usr/local/bin/vllm
  port: 8020
  args:
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.8
    generation_config: vllm
    seed: 1234
    trust_remote_code: true
