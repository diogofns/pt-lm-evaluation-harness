name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev,ifeval]"
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/python -m nltk.downloader punkt_tab
      - run: .venv/bin/pytest

  benchmarks:
    # Validate benchmark changes and changes to this workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: mudou
        with:
          filters: |
            benchmarks:
              - 'src/pt_lm_eval/benchmarks/**'
              - 'src/pt_lm_eval/core/**'
              - 'src/pt_lm_eval/evaluations/**'
              - 'benchmarks.lock.json'
              - '.github/workflows/ci.yml'
      - uses: astral-sh/setup-uv@v5
        if: steps.mudou.outputs.benchmarks == 'true'
      - name: Install benchmark validation dependencies
        if: steps.mudou.outputs.benchmarks == 'true'
        run: uv venv --python 3.12 && uv pip install -e ".[dev,ifeval]"
      - name: Validate benchmarks and preview public prompts
        if: steps.mudou.outputs.benchmarks == 'true'
        env:
          HF_TOKEN: ${{ github.event_name == 'push' && secrets.HF_TOKEN || '' }}
        shell: bash
        run: |
          mapfile -t public_benchmarks < <(.venv/bin/pt-lm-eval benchmarks list | awk '$1 !~ /^gpqa_/ {print $1}')
          if [[ -n "$HF_TOKEN" ]]; then
            .venv/bin/pt-lm-eval benchmarks check --all
          else
            echo '::notice::GPQA requires a Hugging Face token with dataset access. Set HF_TOKEN to validate it on pushes to main.'
            .venv/bin/pt-lm-eval benchmarks check "${public_benchmarks[@]}"
          fi
          unset HF_TOKEN

          echo '## Rendered prompts (2 items per public benchmark)' >> "$GITHUB_STEP_SUMMARY"
          for benchmark in "${public_benchmarks[@]}"; do
            echo "### $benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            .venv/bin/pt-lm-eval benchmarks preview "$benchmark" -n 2 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
